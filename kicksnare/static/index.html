<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kicksnare</title>
<link rel="icon" type="image/png" href="__BASE__/static/favicon.png">
<link rel="apple-touch-icon" href="__BASE__/static/apple-touch-icon.png">
<meta name="theme-color" content="#16181d">
<link rel="stylesheet" href="__BASE__/static/base.css">
</head>
<body>
<header class="brandbar"><div class="in"><a href="__BASE__/" aria-label="Kicksnare — início"><img src="__BASE__/static/logo.png" alt="Kicksnare — partitura de bateria" width="165" height="46"></a></div></header>
<main>
  <h1>Kicksnare</h1>
  <p class="muted">Cole um link do YouTube ou envie um arquivo de áudio. A bateria é isolada e transcrita em partitura.</p>

  <div class="panel">
    <form id="add" class="row">
      <input type="url" id="url" placeholder="https://www.youtube.com/watch?v=..." required>
      <button class="primary" type="submit">Adicionar</button>
    </form>
    <div class="row" style="margin-top:10px">
      <label class="btn" for="file">Enviar arquivo de áudio</label>
      <input id="file" type="file" accept="audio/*,video/*" hidden>
      <span id="msg" class="muted"></span>
    </div>
  </div>

  <h2>Músicas</h2>
  <label id="mineWrap" class="muted small" hidden style="display:none"><input type="checkbox" id="mine"> só as minhas</label>
  <div class="panel" id="list"><span class="muted">Carregando…</span></div>
</main>
<script src="__BASE__/static/auth.js" data-base="__BASE__"></script>
<script>
const BASE = "__BASE__";
const $ = (s) => document.querySelector(s);
const STAGES = { ingest: "baixando", separate: "isolando bateria", transcribe: "transcrevendo", finalize: "finalizando" };

function fmt(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + "m" + String(sec % 60).padStart(2, "0") + "s"; }

function render(songs) {
  const list = $("#list");
  if (!songs.length) { list.innerHTML = '<span class="muted">Nenhuma música ainda.</span>'; return; }
  list.replaceChildren(...songs.map((s) => {
    const row = document.createElement("div"); row.className = "song";
    const left = document.createElement("div");
    const title = document.createElement(s.status === "done" ? "a" : "span");
    title.className = "title"; title.textContent = s.title || s.source;
    if (s.status === "done") title.href = BASE + "/songs/" + encodeURIComponent(s.id);
    left.append(title);
    const meta = document.createElement("div"); meta.className = "muted";
    meta.style.fontSize = ".85rem";
    if (isAdmin && s.owner) {
      const o = document.createElement("span"); o.className = "chip"; o.textContent = "de " + s.owner;
      o.style.marginRight = "8px"; left.append(o);
    }
    if (s.status === "done" && s.stats) {
      meta.textContent = `${s.stats.bars} compassos · ${Math.round(s.stats.bpm_median)} BPM` +
        (s.stats.bars_reliable ? "" : " · compassos pouco confiáveis");
    } else if (s.status === "running") {
      meta.textContent = (s.message || "Processando") + " · " + fmt(Date.now() / 1000 - s.started);
    } else if (s.status === "queued") meta.textContent = "Na fila";
    left.append(meta);
    if (s.status === "error") {
      const e = document.createElement("div"); e.className = "err-text"; e.textContent = s.error || "Erro";
      left.append(e);
    }
    const right = document.createElement("div"); right.className = "row";
    const chip = document.createElement("span");
    chip.className = "chip " + ({ done: "ok", error: "err", running: "warn" }[s.status] || "");
    chip.textContent = { done: "pronto", error: "erro", running: STAGES[s.stage] || "processando", queued: "na fila" }[s.status];
    right.append(chip);
    if (s.status !== "running") {
      const d = document.createElement("button"); d.textContent = "Apagar"; d.className = "danger";
      let armed = false;
      d.onclick = async () => {
        if (!armed) { armed = true; d.textContent = "Confirmar?"; setTimeout(() => { armed = false; d.textContent = "Apagar"; }, 4000); return; }
        const r = await fetch(`${BASE}/api/songs/${encodeURIComponent(s.id)}`, { method: "DELETE" });
        if (!r.ok) { try { alert((await r.json()).detail); } catch {} }
        load();
      };
      right.append(d);
    }
    if (s.status === "error") {
      const b = document.createElement("button"); b.textContent = "Tentar de novo";
      b.onclick = async () => { await fetch(`${BASE}/api/songs/${s.id}/retry`, { method: "POST" }); load(); };
      right.append(b);
    }
    row.append(left, right);
    return row;
  }));
}

async function load() {
  try { render(await (await fetch(BASE + "/api/songs" + ($("#mine").checked ? "?mine=1" : ""))).json()); } catch (e) { $("#list").textContent = "Falha ao carregar: " + e; }
}

$("#add").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("#msg").textContent = "";
  const r = await fetch(BASE + "/api/songs", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url: $("#url").value }) });
  if (!r.ok) { $("#msg").textContent = (await r.json()).detail || "Erro"; return; }
  $("#url").value = ""; load();
});

$("#file").addEventListener("change", async (ev) => {
  const f = ev.target.files[0]; if (!f) return;
  $("#msg").textContent = "Enviando " + f.name + "…";
  const fd = new FormData(); fd.append("file", f);
  const r = await fetch(BASE + "/api/upload", { method: "POST", body: fd });
  $("#msg").textContent = r.ok ? "" : ((await r.json()).detail || "Erro no envio");
  ev.target.value = ""; load();
});

let isAdmin = false;
fetch(BASE + "/api/auth/me").then((r) => r.json()).then((u) => {
  isAdmin = !!u.is_admin;
  if (isAdmin) { $("#mineWrap").hidden = false; $("#mineWrap").style.display = ""; }
  load();
}).catch(() => {});
$("#mine").onchange = load;
load(); setInterval(load, 3000);
</script>
</body>
</html>
