# Dentro do bloco server { ... } do site existente. O app já trata o prefixo /kicksnare,
# então o nginx repassa o caminho sem reescrever.
location = /kicksnare { return 301 /kicksnare/; }

location /kicksnare/ {
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 300m;     # upload de áudio (limite do app: 300 MB) e PDF (50 MB)
    proxy_read_timeout 300s;
    proxy_request_buffering off;
}
